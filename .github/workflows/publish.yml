# .github/workflows/publish.yml
#
# 发布工作流 — Release 触发，将正常版本 (如 1.5.5) 发布到 Maven Central。
#
# ┌──────────────────────────────────────────────────────────────────┐
# │ 文件数配额优化（maven-publish 插件 >= 0.37.0，2026-09）：         │
# │                                                                  │
# │ Central Portal 对 File Count 有月度配额限制。插件 0.37.0 起在    │
# │ 上传 Maven Central 时默认精简发布文件：                          │
# │  - 不再为 .asc 签名文件生成 .md5/.sha1/.sha256/.sha512 校验和    │
# │    (Sonatype 官方明确不需要，见 gradle/gradle#20232)             │
# │  - 不再上传可选的 .sha256/.sha512，只保留必须的 .md5/.sha1       │
# │                                                                  │
# │ 效果: 每个工件 10 个文件 → 4 个；单模块 360 → 144 个文件。       │
# │ 行为由 gradle.properties 中 mavenCentralChecksums /              │
# │ mavenCentralExcludeSignatureChecksums 显式固定。                 │
# │                                                                  │
# │ 历史说明: 曾有 publish-alias Job 在每次 Release 时追加发布        │
# │ -kt2.1.0 别名版本（降级 Kotlin/Compose 的兼容版）。              │
# │ 为控制 File Count 配额已于 2026-09 移除，今后只发布正常版本。    │
# └──────────────────────────────────────────────────────────────────┘

name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  # ==================== Job 0: 发布前测试 ====================
  test:
    name: "🧪 Pre-publish tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Run latex-parser tests
        run: ./gradlew :latex-parser:cleanJvmTest :latex-parser:jvmTest

      - name: Run latex-renderer tests
        run: ./gradlew :latex-renderer:jvmTest

  # ==================== Job 1: 发布 ====================
  publish:
    name: "📦 Publish to Maven Central"
    needs: test
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Get VERSION from gradle.properties
        run: |
          VERSION=$(grep '^VERSION=' gradle.properties | cut -d'=' -f2)
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 发布到 Maven Central              ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  VERSION = $VERSION"
          echo "║"
          echo "║  将发布:"
          echo "║    io.github.zusrsoft:latex-base:$VERSION"
          echo "║    io.github.zusrsoft:latex-parser:$VERSION"
          echo "║    io.github.zusrsoft:latex-renderer:$VERSION"
          echo "╚══════════════════════════════════════╝"

      - name: Publish to MavenCentral
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
